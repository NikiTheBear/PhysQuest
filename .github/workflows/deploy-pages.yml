name: 部署在线版

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: 安装依赖
        working-directory: apps/web
        run: npm ci

      - name: 构建（静态模式）
        working-directory: apps/web
        env:
          # Pages 部署在 /PhysQuest/ 子路径下
          VITE_BASE: /PhysQuest/
          # 让自由搭建工作台走静态单文件版，不需要本地服务
          VITE_STATIC_WORKBENCH: '1'
        run: npm run build

      - name: 拷贝离线工作台与实验文件
        run: |
          mkdir -p apps/web/dist/prompts
          cp shared/knowledge-data/knowledge-prompts.json apps/web/dist/prompts/ 2>/dev/null || true
          touch apps/web/dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
