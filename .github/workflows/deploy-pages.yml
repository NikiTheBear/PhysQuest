name: 部署在线版

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            platform/package-lock.json
            platform/physquest/apps/web/package-lock.json

      - name: 同步网页快照
        working-directory: platform
        run: npm run sync:physquest

      - name: 安装依赖
        working-directory: platform
        run: npm run install:ci

      - name: 构建
        working-directory: platform
        env:
          # GitHub Pages 部署在 /PhysQuest/ 子路径下，必须告诉 Vite
          VITE_BASE: /PhysQuest/
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: platform/dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
