name: 预检

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: 安装依赖
        working-directory: apps/web
        run: npm ci

      - name: TypeScript 类型检查
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: 物理断言
        working-directory: apps/web
        run: npm test

      - name: 内容校验
        run: node shared/knowledge-data/schema/validate.mjs

      - name: 平台依赖
        working-directory: platform
        run: npm ci

      - name: 平台快照与测试资源
        working-directory: platform
        run: |
          node scripts/sync-physquest.mjs
          node scripts/gen-test-assets.mjs

      - name: 平台测试
        working-directory: platform
        run: npm test

      - name: 扫密钥
        run: |
          if git ls-files -z | xargs -0 grep -aEn "sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}" \
              | grep -v "sk-\.\.\.\|sk-你的\|sk-test\|sk-fake\|sk-invalid\|placeholder"; then
            echo "::error::发现疑似密钥"
            exit 1
          fi
          echo "没有发现密钥"
