name: 预检

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            platform/package-lock.json
            platform/physquest/apps/web/package-lock.json
      - name: 安装网页依赖
        working-directory: apps/web
        run: npm ci
      - name: 同步平台中的网页快照
        working-directory: platform
        run: npm run sync:physquest
      - name: 安装平台依赖
        working-directory: platform
        run: npm run install:ci
      - name: 原版预检
        run: bash scripts/preflight.sh
      - name: 构建与产物验证
        working-directory: platform
        run: |
          npm run build
          npm run validate
      - name: 平台物理、MCP 与 DeepSeek 回归
        working-directory: platform
        run: npm test
      - name: 校验 GitHub Pages 静态构建
        working-directory: platform
        env:
          VITE_BASE: /PhysQuest/
        run: npm run build:pages
